<html>
    <body>
        <p id="demo"></p>
        <p id="demo2"></p>
        <p id="demo3"></p>
        <script>
function detail(some){
document.getElementById("demo").innerHTML=some;
}
function fname(){
    detail("khooshi");
}
function lname(){
    detail("B");
}
fname();
lname();

setTimeout(myfun,3000);
function myfun(){
document.getElementById("demo2").innerHTML="hello there";
}
//promise:to call async

function display(data){
    document.getElementById("demo3").innerHTML=data;
}
let datapromise=new Promise(function(iseven,isodd){
    let x=48;

    if(x%2==0){
        iseven("it is even");
    }
    else{
        isodd("it is odd");
    }});
    datapromise.then(
        function(value){display(value);},
        function(error){display(error);}
);
        </script>
    </body>
</html>
